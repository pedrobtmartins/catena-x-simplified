# Default values for catenax-simplified. Every app setting is a CXS_* environment variable
# (see backend/README.md); put plain settings in `config`, secrets in `secrets` or an existing
# Secret (`existingSecret`).

image:
  repository: catenax-simplified
  tag: ""            # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Plain settings → ConfigMap (values must be strings; JSON for lists and objects).
config:
  CXS_OWN_BPNL: "BPNL000000000000"
  # CXS_DTR_BASE_URL: "http://dtr.example:8080"
  # CXS_EDC_MANAGEMENT_URL: "http://edc-controlplane:8081"
  # CXS_EDC_MANAGEMENT_PATH: "/management"
  # CXS_NOTIFICATION_BASE_URL: "http://catenax-simplified:8000"   # how our EDC's data plane reaches us
  # CXS_ACCEPTED_POLICIES: '[...]'
  # CXS_PARTNER_CONNECTORS: '{"BPNL…": "https://edc.partner/api/v1/dsp"}'
  # CXS_CENTRAL_IDP_URL: https://centralidp.example/auth/          # + CXS_CENTRAL_IDP_CLIENT_ID; secret below
  # CXS_DISCOVERY_FINDER_URL: https://discoveryfinder.example/api/v1.0/administration/connectors/discovery/search
  # CXS_BPDM_POOL_URL: https://business-partners.example/pool/api
  # Or partner names through our EDC from the Cofinity-X Business Partner Explorer (wins over BPDM):
  # CXS_BP_EXPLORER_ADDRESS: https://business-partner-explorer-edc.dataspaceos.svc.cofinity-x.com/api/v1/dsp
  # CXS_BP_EXPLORER_BPNL: BPNLCOFINITYEZFA
  # CXS_SYNC_INTERVAL_SECONDS: "900"

# Secret settings → Secret created by the chart (e.g. CXS_EDC_API_KEY, CXS_NOTIFICATION_API_KEY,
# CXS_OAUTH_CLIENT_SECRET, CXS_EDC_OAUTH_CLIENT_SECRET, CXS_CENTRAL_IDP_CLIENT_SECRET, CXS_DATABASE_URL with credentials).
# The admin login of the Setup page: CXS_ADMIN_PASSWORD_HASH and CXS_SECRET_KEY (keep the key
# stable; it encrypts the settings entered in the UI).
secrets: {}
# Or reference a Secret you manage; its keys become environment variables.
existingSecret: ""

# Without CXS_DATABASE_URL the app uses SQLite in /data (kept on this volume).
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: traceability.example.com
      paths: ["/"]
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

podSecurityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
