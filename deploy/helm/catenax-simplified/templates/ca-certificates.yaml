{{- if .Values.caCertificates.certificates }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cxs.fullname" . }}-ca-certificates
  labels: {{- include "cxs.labels" . | nindent 4 }}
data:
  {{- range $name, $pem := .Values.caCertificates.certificates }}
  {{ $name }}: {{ $pem | quote }}
  {{- end }}
{{- end }}
