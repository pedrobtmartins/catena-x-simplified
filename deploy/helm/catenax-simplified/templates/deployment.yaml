apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cxs.fullname" . }}
  labels: {{- include "cxs.labels" . | nindent 4 }}
spec:
  replicas: 1  # one instance: syncs and the EDR cache run in-process
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "cxs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cxs.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.caCertificates.certificates }}
        checksum/ca-certificates: {{ include (print $.Template.BasePath "/ca-certificates.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "cxs.fullname" . }}
            {{- if .Values.secrets }}
            - secretRef:
                name: {{ include "cxs.fullname" . }}
            {{- end }}
            {{- with .Values.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if include "cxs.caCertificates.enabled" . }}
          env:
            - name: CXS_EXTRA_CA_DIR
              value: /etc/catenax-simplified/ca-certificates
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if include "cxs.caCertificates.enabled" . }}
            - name: ca-certificates
              mountPath: /etc/catenax-simplified/ca-certificates
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "cxs.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if include "cxs.caCertificates.enabled" . }}
        - name: ca-certificates
          projected:
            sources:
              {{- if .Values.caCertificates.certificates }}
              - configMap:
                  name: {{ include "cxs.fullname" . }}-ca-certificates
              {{- end }}
              {{- with .Values.caCertificates.existingConfigMap }}
              - configMap:
                  name: {{ . }}
              {{- end }}
              {{- with .Values.caCertificates.existingSecret }}
              - secret:
                  name: {{ . }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
