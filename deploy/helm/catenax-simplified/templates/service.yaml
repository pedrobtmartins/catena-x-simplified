apiVersion: v1
kind: Service
metadata:
  name: {{ include "cxs.fullname" . }}
  labels: {{- include "cxs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector: {{- include "cxs.selectorLabels" . | nindent 4 }}
