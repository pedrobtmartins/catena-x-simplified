# Database migrations. The app applies them at startup; to create a new one after changing
# storage/tables.py:
#   CXS_DATABASE_URL=sqlite:///./catenax-simplified.db uv run alembic revision --autogenerate -m "…"
[alembic]
script_location = src/catenax_simplified/migrations
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///./catenax-simplified.db

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
