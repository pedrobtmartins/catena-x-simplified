[project]
name = "catenax-simplified"
version = "0.1.0"
description = "Lightweight Catena-X traceability application based on the Traceability KIT"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The Tractus-X SDK pins FastAPI to 0.120.x.
    "tractusx-sdk>=0.8.2,<0.9",
    "fastapi>=0.120.3,<0.121",
    "uvicorn>=0.30,<0.36.1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0.38,<3",
    "requests>=2.33,<3",
    "alembic>=1.13,<2",
    # Encrypts the secrets an admin enters in the UI (already required by the SDK).
    "cryptography>=44,<51",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "httpx>=0.26,<0.29",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catenax_simplified"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
